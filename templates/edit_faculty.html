<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Faculty</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="page-container">

    <div class="page-header">

        <div>
            <h1>Edit Faculty</h1>
            <p>Update faculty information.</p>
        </div>

        <a href="/faculty" class="back-button">
            ← Faculty
        </a>

    </div>


    <div class="form-card">

        <form
            action="{{ url_for(
                'edit_faculty',
                faculty_id=faculty.faculty_id
            ) }}"
            method="POST"
        >

            <div class="form-group">

                <label>Faculty ID</label>

                <input
                    type="text"
                    value="{{ faculty.faculty_id }}"
                    readonly
                >

            </div>


            <div class="form-group">

                <label>Name</label>

                <input
                    type="text"
                    name="name"
                    value="{{ faculty.name }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>Classes Handled</label>

                <input
                    type="text"
                    name="classes"
                    value="{{ faculty.classes }}"
                    placeholder="Example: 1,3,5"
                    required
                >

            </div>


            <div class="actions">

                <button
                    type="submit"
                    class="primary-button"
                >
                    Save Changes
                </button>

                <a
                    href="/faculty"
                    class="secondary-button"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
